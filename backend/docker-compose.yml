# Redis Stack for the CreaseIQ response cache.
#   docker compose up -d        start (data persists in the named volume)
#   RedisInsight (web UI):      http://localhost:8001
#   CLI:                        docker exec -it creaseiq-redis redis-cli
services:
  redis:
    image: redis/redis-stack:latest
    container_name: creaseiq-redis
    ports:
      - "6379:6379"      # Redis
      - "8001:8001"      # RedisInsight
    environment:
      REDIS_ARGS: "--appendonly yes"
    volumes:
      - creaseiq-redis-data:/data
    restart: unless-stopped
volumes:
  creaseiq-redis-data:
