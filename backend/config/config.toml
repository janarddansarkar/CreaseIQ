# CreaseIQ configuration: the single file for the whole backend. Override the path with $CREASEIQ_CONFIG.
#   [settings.*]  workflow switches, limits, thresholds
#   [lexicon.*]   word lists, regex patterns, format->tool map, stub-model data
#   [prompts]     system prompts and templates ({placeholders} are filled with str.format)
#   [strings.*]   fixed user-facing messages per language
#   [kb.*]        knowledge base: paths, chunking, BM25, Chroma, retrieval fusion (relative paths resolve against the project root)

# ================================================================ settings
[settings.paths]
env_file  = ".env"                   # relative to backend/

[settings.llm]
use_stub          = true             # true: offline rule-based stub (no model server needed). false: OpenAI-compatible endpoint (local Ollama)
structured_method = "json_schema"    # for with_structured_output; try "function_calling" if Ollama rejects it
structured_attempts = 2              # tries per structured call before the node records an error
base_url_env      = "OLLAMA_BASE_URL"
base_url_default  = "http://localhost:11434/v1"
model_env         = "OLLAMA_MODEL"
model_default     = "llama3.2:3b"
api_key           = "ollama"
temperature       = 0
timeout_seconds   = 180
max_retries       = 1

[settings.features]
general_qa_enabled = true            # web-search branch for clearly non-cricket questions

[settings.limits]
max_clarifications    = 2            # clarification turns per question (missing facts AND unclear domain)
max_retrieval_retries = 1            # reformulated retrieval attempts
max_repairs           = 1            # constrained answer repairs
recursion_limit       = 40
max_input_chars       = 1000         # input_guard: longer messages are refused
max_output_chars      = 2000         # output_guard: longer replies are rejected
input_cut_multiplier  = 3            # sanitize_input hard-cuts at max_input_chars * this (too_long is still detected)

[settings.retrieval]
top_k     = 3                        # passages per search tool call
repair_fallback_passages = 2         # passages cited if a repair has no valid citation left
min_score = 0.2                      # reranker probability a passage needs to count as evidence (relevant ~0.25-0.99, irrelevant <0.05)

[settings.web]
provider    = "tavily"                 # ddgs (no API key) | tavily (needs the key named below)
max_results = 3
max_snippet_chars = 500             # each result snippet is cut to this length
timeout_seconds = 15
region      = "wt-wt"                # ddgs region ("wt-wt" = no region)
safesearch  = "moderate"             # ddgs: on | moderate | off
tavily_url  = "https://api.tavily.com/search"
tavily_key_env = "TAVILY_API_KEY"
tavily_depth = "basic"               # basic | advanced

[settings.language]
default              = "en"
min_devanagari_ratio = 0.3           # share of Devanagari letters at which a message counts as Hindi

[settings.guardrails]
max_other_script_ratio   = 0.3       # share of non-Latin, non-Devanagari letters above which input is refused
latin_max_codepoint      = 0x024F
devanagari_range         = [0x0900, 0x097F]
wrong_language_deva_ratio = 0.1      # English reply with more Devanagari than this is flagged
hindi_min_letters        = 20        # Hindi reply check only applies from this many letters
prompt_leak_ngram_words  = 8         # word n-gram overlap with any system prompt counts as a leak
secret_env_vars          = ["SARVAM_API_KEY", "LANGSMITH_API_KEY"]
min_secret_length        = 8

[settings.memory]                            # SQLite memory (users, turns, long-term profile, graph checkpoints)
db_path        = "backend/data/memory.sqlite"      # relative to the project root; override with $CREASEIQ_MEMORY_DB
max_users      = 25                  # the oldest user is deleted when a new user would exceed this
max_turns      = 25                  # per user; the oldest turn is dropped when exceeded
max_topics     = 10                  # long-term topics remembered per user
prefill_format = true                # use the remembered format when a question does not name one (the answer says so)

[settings.context]                           # conversation context shown to the routing step
recent_turns       = 3               # newest turns shown in detail; older ones as one-liners
max_history_tokens = 600             # history budget (about 4 characters per token); oldest one-liners are dropped first
question_chars     = 160             # a stored question / normalised query is cut to this
gist_chars         = 200             # a stored answer conclusion is cut to this
old_question_words = 12              # words of the question kept in an older turn's one-liner

[settings.stub]                               # offline stand-in model
max_cited_passages = 2
max_quote_chars    = 300             # the stub quotes only this much of each passage


# ================================================================ lexicon
# Regexes are TOML literal strings ('...'), so backslashes are written as-is.

[lexicon.languages]                                    # supported reply languages
en = "English"
hi = "Hindi (हिन्दी)"

[lexicon.format_tools]                                 # match format -> search tool name (retrieval is chosen in code, never by the model)
ODI  = "search_odi_rules"
T20I = "search_t20i_rules"

[lexicon.format_patterns]                              # how a format is recognised in text
ODI  = '\bodis?\b|one[- ]day|वनडे'
T20I = '\bt20is?\b|\bt20\b|twenty[- ]?20|टी-?20'

[lexicon.routing]
compare_pattern = 'differ|difference|compare|comparison|versus|\bvs\b|अंतर'
clause_pattern  = 'clause\s+([\w.\-]+)'
clause_ref_pattern = 'clause\s+([A-Za-z0-9][\w.\-]*)'   # clause mentions inside a drafted answer
followup_pattern = '^\s*(?:and\b|also\b|what about\b|how about\b|what if\b|same\b|in that case\b|does that\b|do those\b|do they\b|is that\b|is it\b|और|तो|इसके बारे में)'   # an elliptical follow-up at the START of a message
clause_strip_chars = ".-"
answer_ref_strip_chars = ".,;)"

[lexicon.routing.unsupported_markers]                  # text fragment -> unsupported_reason
"test match"   = "format_not_supported"
"test cricket" = "format_not_supported"
"women's"      = "format_not_supported"
"womens"       = "format_not_supported"
"ipl"          = "competition_specific"
"big bash"     = "competition_specific"

[lexicon.guardrails]
pii = [                                        # [kind, regex]
  ["EMAIL", '[\w.+-]+@[\w-]+\.[\w.-]+'],
  ["PHONE", '(?<!\d)(?:\+?\d[\d\s-]{8,}\d)(?!\d)'],
]
keep_control_chars = ["\n", "\t", "‌", "‍"]   # kept by sanitize_input (ZWJ/ZWNJ matter for Indic scripts)
toxic_en = ["fuck", "fucking", "fucker", "motherfucker", "shit", "bullshit", "bitch", "bastard", "asshole",
            "dickhead", "cunt", "slut", "whore", "retard", "faggot"]
toxic_hi = []                                  # intentionally empty until a native speaker reviews one
injection_patterns = [
  '\b(?:ignore|disregard|forget|override)\b[^.\n]{0,25}\b(?:previous|prior|above|earlier|all|your|these)\b[^.\n]{0,15}\b(?:instructions?|prompts?|rules|guidelines|directions)\b',
  '\b(?:reveal|show|print|repeat|display|tell me|give me|output)\b[^.\n]{0,20}\b(?:system|hidden|initial|original|developer)\b[^.\n]{0,10}\b(?:prompt|instructions?|message)\b',
  '\bsystem\s+prompt\b',
  '\byou are now\b',
  '\bpretend (?:you are|to be)\b',
  '\bdeveloper mode\b|\bjailbreak\b|\bDAN mode\b',
  '\b(?:api|secret|access)[ _-]?keys?\b',
  '</?\s*evidence\s*>',
  '(?:पिछले|ऊपर के|सभी)[^।\n]{0,25}(?:निर्देश|आदेश)[^।\n]{0,25}(?:अनदेखा|नज़रअंदाज़|नजरअंदाज|भूल)',
  'सिस्टम\s*प्रॉम्प्ट|सिस्टम\s*प्रोम्प्ट',
]
authority_patterns = ['\bbinding\b', '\bofficial (?:ruling|verdict)\b', '\bI (?:hereby )?(?:rule|declare)\b', '\bas (?:the|your) (?:umpire|referee)\b']
key_patterns = ['\bsk-[A-Za-z0-9]{10,}', '\blsv2_[A-Za-z0-9_]{8,}']

# ---- offline stub model ---------------------------------------------------------------------------------------
[lexicon.stub]
cricket_words = ["cricket", "odi", "t20", "t20i", "no-ball", "noball", "bowler", "bowled", "batter", "batsman", "stump", "stumps",
                 "wicket", "over", "overs", "powerplay", "lbw", "free", "hit", "umpire", "crease", "fielder", "fielders", "innings",
                 "run", "runs", "bail", "bails", "test", "ipl", "pitch", "delivery", "popping", "boundary", "keeper"]
cricket_phrases = ["no ball", "no-ball", "free hit", "popping crease", "front foot", "नो-बल", "नो बल", "क्रिकेट", "गेंदबाज", "बॉलर", "क्रीज", "बल्लेबाज"]
cricket_format_pattern = '\bodis?\b|\bt20'
non_cricket_hints = ["capital of", "football", "recipe", "weather", "movie", "stock price", "python", "president", "who won the", "how to cook"]
hindi_prefix = "[हिंदी] "
no_evidence = "No evidence."
answer_line = "Under clause {clause} ({fmt}): {text}"
